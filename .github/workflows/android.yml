name: Android CI

on:
  workflow_dispatch:
  push:
    branches: ["main"]
    tags:
      - "v*"
    paths-ignore:
      - "README.md"
      - "doc/*"
      - ".github/workflows/android.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: "zulu"
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Decode Signing Key
        run: echo ${{ secrets.SIGNING_KEY }} | base64 -d > keystore.jks

      # ✅ 新增：生成基准配置文件（让 ART 提前 AOT 编译热点代码）
      - name: Generate Baseline Profile
        run: |
          # 只在存在 benchmark 模块时才生成，避免没有配置时 CI 失败
          if [ -d "benchmark" ] || grep -q "macrobenchmark" settings.gradle* 2>/dev/null; then
            ./gradlew :benchmark:connectedAndroidTest \
              -Pandroid.testInstrumentationRunnerArguments.androidx.benchmark.enabledRules=BaselineProfile
          else
            echo "未找到 Macrobenchmark 模块，跳过基准配置文件生成"
            echo "如需启用，请参考 https://developer.android.com/topic/performance/baselineprofiles"
          fi

      # ✅ 新增：确保 R8 优化规则生效（打包前校验）
      - name: Verify R8 Optimization
        run: |
          echo "检查 release 构建类型是否启用 R8 优化..."
          # 简单校验：确认存在 optimize 版规则文件引用
          if grep -r "proguard-android-optimize.txt" app/android/build.gradle* app/build.gradle* 2>/dev/null; then
            echo "✅ 已使用 proguard-android-optimize.txt，R8 深度优化已开启"
          else
            echo "⚠️ 警告：未检测到 proguard-android-optimize.txt，可能缺少 R8 优化"
          fi

      - name: Build Release APK
        run: |
          ./gradlew :app:android:assembleRelease
          echo "APK_FILE=$(find app/android/build/outputs/apk/release -name '*.apk' | head -n 1)" >> $GITHUB_ENV
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/keystore.jks
          KEYSTORE_PASS: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Upload APK Artifact
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v7
        with:
          path: ${{ env.APK_FILE }}
          archive: false

      - name: Display APK Hashes
        run: |
          echo "### APK Hashes" >> $GITHUB_STEP_SUMMARY
          echo "| Hash Type | Hash Value |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| SHA256 | \`$(sha256sum "$APK_FILE" | awk '{ print $1 }')\` |" >> $GITHUB_STEP_SUMMARY
          echo "| SHA1 | \`$(sha1sum "$APK_FILE" | awk '{ print $1 }')\` |" >> $GITHUB_STEP_SUMMARY
          echo "| MD5 | \`$(md5sum "$APK_FILE" | awk '{ print $1 }')\` |" >> $GITHUB_STEP_SUMMARY
